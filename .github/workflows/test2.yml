name: Build iStoreOS-2 + ImageBuilder (25.12)    
on:  
  workflow_dispatch:  
    inputs:  
      profile:  
        description: '设备 PROFILE（用于验证编译，如 easepi_ars4）'  
        required: true  
        default: 'easepi_ars4'

permissions:  
  contents: write   # 上传 Release 需要  
  
env:  
  TARGET: rockchip  
  SUBTARGET: rk35xx  
  BRANCH: istoreos-25.12  
  RELEASE_TAG: imagebuilder-rk35xx   # 固定 tag，滚动更新  
  
jobs:  
  build:  
    runs-on: ubuntu-24.04  
    steps:  
      - name: 安装编译依赖  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-dev python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget swig qemu-utils
          sudo apt-get install -y libelf-dev dwarves u-boot-tools device-tree-compiler bc cpio xxd
  
      - name: 拉取 25.12 分支源码  
        uses: actions/checkout@v4  
        with:  
          ref: ${{ env.BRANCH }}  
          fetch-depth: 0  
  
      - name: 更新并安装 feeds  
        run: |  
          ./scripts/feeds update -a  
          ./scripts/feeds install -a  
  
      - name: 生成 .config（目标 + 设备 + ImageBuilder）  
        run: |  
          {  
            echo "CONFIG_TARGET_${TARGET}=y"  
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"  
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${{ inputs.profile || 'easepi_ars4' }}=y"  
            echo "CONFIG_IB=y"  
            echo "CONFIG_SDK=n"  
            echo "CONFIG_MAKE_TOOLCHAIN=n"  
          } > .config  
          make defconfig 
  
      - name: 下载源码包  
        run: make download -j$(nproc)  
  
      - name: 编译固件与 ImageBuilder  
        run: make -j$(nproc) V=s  
        
      - name: 查看产物目录（调试）  
        run: |  
          find bin/targets -maxdepth 2 -type d  
          find bin/targets -name '*imagebuilder*' -o -name '*.img.gz' | head -50  
  
      - name: 上传 ImageBuilder 到 Release  
        env:  
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
        run: |  
          IB_DIR=$(dirname "$(find bin/targets -name '*imagebuilder*.tar.xz' | head -n1)")  
          [ -n "$IB_DIR" ] && [ "$IB_DIR" != "." ] || { echo "未找到 imagebuilder 产物"; exit 1; }  
          cd "$IB_DIR"  
          gh release create "${RELEASE_TAG}" \  
            --title "ImageBuilder ${TARGET}/${SUBTARGET}" \  
            --notes "iStoreOS 25.12 ImageBuilder，由 CI 自动生成" \  
            --latest=false 2>/dev/null || true  
          gh release upload "${RELEASE_TAG}" *imagebuilder*.tar.xz --clobber
